patch:
  style:
    color_scheme: begonia
    color_scheme_dark: begonia_dark            # 跟随系统外观自动切换
    alpha: 1
    base_offset: 0
    candidate_list_layout: linear              # 新版 key，horizontal 已在 Squirrel 1.0.1 移除
    translucency: false                        # 毛玻璃（需系统支持）
    shadow_size: 0
    line_spacing: 4                            # 候选词上下间距（垂直方向生效）
    inline_preedit: true
    border_height: 2
    border_width: 2
    border_color: 0xffffff
    corner_radius: 4
    back_color: 0xF4F4F6
    text_color: 0x000000
    preedit_back_color: 0x364572
    hilited_back_color: 0xFFFFFF
    hilited_text_color: 0x000000
    candidate_format: "%c. %@ "
    font_face: "PingFang SC"
    font_point: 16
    label_font_face: "PingFang SC"
    label_font_point: 14
    label_color: 0xaaaaaa
    comment_font_face: "PingFang SC"
    comment_font_point: 13
    comment_text_color: 0xBBCC27
    hilited_corner_radius: 0
    hilited_candidate_label_color: 0x884F11FA
    hilited_candidate_text_color: 0x4F11FA
    hilited_candidate_back_color: 0xEDEDF9
    hilited_comment_text_color: 0xF19C38
    candidate_text_color: 0x222222
    spacing: 8
    text_orientation: horizontal
  preset_color_schemes:
    peach: # 桃红字体，#F47983，无边框、高亮背景近透明
      name: "桃红（亮）"
      author: "cheebun <https://github.com/cheebun>"
      back_color: 0xFFFFFF
      comment_text_color: 0x5D5D5D
      hilited_candidate_back_color: 0x008379F4
      hilited_candidate_text_color: 0x8379F4
      text_color: 0x424242
      label_color: 0x424242
      candidate_text_color: 0x424242
      hilited_comment_text_color: 0x9C94F6
      hilited_text_color: 0x8379F4
    peach_dark: # 桃红字体，#F47983，暗色
      name: "桃红（暗）"
      author: "cheebun <https://github.com/cheebun>"
      border_color: 0x00FFFFFF                 # 透明，避免深色背景上出现白边框
      comment_text_color: 0xBABABB
      hilited_candidate_text_color: 0x8379F4
      text_color: 0xE9E9EA
      label_color: 0xE9E9EA
      candidate_text_color: 0xE9E9EA
      hilited_comment_text_color: 0x6F67CF
      hilited_text_color: 0x8379F4
      back_color: 0x40342E
      hilited_candidate_back_color: 0x00808080
    begonia: # 海棠红字体，#F03752，无边框、高亮背景近透明
      name: 海棠红
      author: "cheebun <https://github.com/cheebun>"
      back_color: 0xFFFFFF
      comment_text_color: 0x5D5D5D
      hilited_candidate_back_color: 0x0075B100
      hilited_candidate_text_color: 0x5237F0
      text_color: 0x424242
      label_color: 0x424242
      candidate_text_color: 0x424242
      hilited_comment_text_color: 0x755FF3
      border_color: 0x00FFFFFF
      hilited_text_color: 0x5237F0
    begonia_dark:
      name: "海棠红（暗）"
      author: "cheebun <https://github.com/cheebun>"
      border_color: 0x00FFFFFF                 # 透明，避免深色背景上出现白边框
      comment_text_color: 0xBABABB
      hilited_candidate_back_color: 0x0075B100
      hilited_candidate_text_color: 0x5237F0
      text_color: 0xE9E9EA
      label_color: 0xE9E9EA
      candidate_text_color: 0xE9E9EA
      hilited_comment_text_color: 0x422CC0
      hilited_text_color: 0x5237F0
      back_color: 0x2E2925
