# 移植自 squirrel.custom.yaml 的 roseo（玫红）配色，作者 KyleBing
# 鼠须管颜色为 BGR，这里已换算成 RGB；圆角和编码提示颜色 fcitx5 不支持，已省略
[Metadata]
Name=Roseo
Name[zh_CN]=玫红
Version=1
Author=KyleBing (ported)
Description=Ported from Squirrel roseo color scheme
ScaleWithDPI=True

[InputPanel]
NormalColor=#000000
HighlightCandidateColor=#FA114F
HighlightColor=#000000
HighlightBackgroundColor=#ffffff
PageButtonAlignment=Last Candidate
Spacing=10

[InputPanel/TextMargin]
Left=6
Right=6
Top=5
Bottom=5

[InputPanel/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Background]
Color=#ffffff
BorderColor=#D6D6D6
BorderWidth=1

[InputPanel/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Highlight]
Color=#F9EDED

[InputPanel/Highlight/Margin]
Left=6
Right=6
Top=5
Bottom=5

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[Menu/Background]
Color=#ffffff
BorderColor=#D6D6D6
BorderWidth=1

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/CheckBox]
Image=radio.svg

[Menu/SubMenu]
Image=arrow.svg

[Menu/Highlight]
Color=#F9EDED

[Menu/Highlight/Margin]
Left=5
Right=5
Top=5
