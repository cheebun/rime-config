# 移植自 squirrel.custom.yaml 的 peach_dark 配色，作者 cheebun
# 鼠须管颜色为 BGR，这里已换算成 RGB；高亮背景原为全透明（alpha 00），这里保持透明
# 圆角和编码提示颜色 fcitx5 不支持，已省略；原配色边框透明，这里不画边框
[Metadata]
Name=Peach Dark
Name[zh_CN]=桃红（暗）
Version=1
Author=cheebun (ported)
Description=Ported from Squirrel peach_dark color scheme
ScaleWithDPI=True

[InputPanel]
NormalColor=#EAE9E9
HighlightCandidateColor=#F47983
HighlightColor=#F47983
HighlightBackgroundColor=#2E3440
PageButtonAlignment=Last Candidate
Spacing=10

[InputPanel/TextMargin]
Left=6
Right=6
Top=5
Bottom=5

[InputPanel/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Background]
Color=#2E3440
BorderColor=#2E344000
BorderWidth=0

[InputPanel/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Highlight]
