# 移植自 squirrel.custom.yaml 的 peach 配色，作者 cheebun
# 鼠须管颜色为 BGR，这里已换算成 RGB；高亮背景原为全透明（alpha 00），这里保持透明
# 圆角和编码提示颜色 fcitx5 不支持，已省略；原配色边框透明，这里不画边框
[Metadata]
Name=Peach
Name[zh_CN]=桃红（亮）
Version=1
Author=cheebun (ported)
Description=Ported from Squirrel peach color scheme
ScaleWithDPI=True

[InputPanel]
NormalColor=#424242
HighlightCandidateColor=#F47983
HighlightColor=#F47983
HighlightBackgroundColor=#FFFFFF
PageButtonAlignment=Last Candidate
Spacing=10

[InputPanel/TextMargin]
Left=6
Right=6
Top=5
Bottom=5

[InputPanel/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Background]
Color=#FFFFFF
BorderColor=#FFFFFF00
BorderWidth=0

[InputPanel/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Highlight]
Color=#FFFFFF00

[InputPanel/Highlight/Margin]
Left=6
Right=6
Top=5
Bottom=5

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[Menu/Background]
Color=#FFFFFF
BorderColor=#D6D6D6
BorderWidth=1

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/CheckBox]
Image=radio.svg

[Menu/SubMenu]
Image=arrow.svg

[Menu/Highlight]
Color=#F2F2F2

[Menu/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[Menu/Separator]
Color=#D6D6D6

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
